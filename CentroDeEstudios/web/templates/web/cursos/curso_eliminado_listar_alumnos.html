<!-- templates/web/cursos/curso_eliminado_listar_alumnos.html -->
{% extends "web/base.html" %}
{% load static %}

{% block title %}Alumnos del Curso Eliminado - {{ curso.nombre }}{% endblock %}

{% block main %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>👥 Alumnos del Curso Eliminado: {{ curso.nombre }}</h1>
        <a href="{% url 'cursos_eliminados' %}" class="btn btn-secondary">
            <i class="fa fa-arrow-left"></i> Volver a Cursos Eliminados
        </a>
    </div>
    
    <!-- Advertencia de curso eliminado -->
    <div class="alert alert-warning">
        <i class="fa fa-exclamation-triangle"></i> 
        <strong>ADVERTENCIA:</strong> Este es un curso <strong>ELIMINADO</strong>. Solo modo consulta.
    </div>
    
    <!-- ... tu contenido existente para listar alumnos (igual que el otro template pero con estilo de eliminado) ... -->
</div>
{% endblock %}
