{% extends 'web/base.html' %}
{% load static %}

{% block extra_css %}
<link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" rel="stylesheet" />
<style>
    .card {
        border: none;
        border-radius: 1rem;
        box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        margin-bottom: 1.5rem;
    }
    .card-header {
        background-color: transparent;
        border-bottom: 1px solid rgba(0,0,0,.125);
        font-weight: 600;
        padding: 1rem 1.25rem;
    }
    .concepto-row {
        background-color: #f8f9fa;
        border-radius: 0.5rem;
        padding: 1rem;
        margin-bottom: 1rem;
        transition: all 0.2s;
    }
    .concepto-row:hover {
        box-shadow: 0 0.125rem 0.5rem rgba(0,0,0,0.1);
    }
    .remove-row {
        color: #dc3545;
        cursor: pointer;
        font-size: 1.25rem;
        transition: 0.2s;
    }
    .remove-row:hover {
        color: #a71d2a;
        transform: scale(1.1);
    }
    .total-card {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-radius: 1rem;
        padding: 1rem;
    }
    .form-control, .form-select {
        border-radius: 0.5rem;
    }
    .btn-primary {
        background-color: #4e73df;
        border-color: #4e73df;
        border-radius: 0.5rem;
        padding: 0.5rem 1.5rem;
    }
    .btn-secondary {
        border-radius: 0.5rem;
    }
    .icon-input {
        position: relative;
    }
    .icon-input i {
        position: absolute;
        left: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        color: #6c757d;
    }
    .icon-input input, .icon-input select, .icon-input textarea {
        padding-left: 2rem;
    }
    .form-label i {
        margin-right: 0.5rem;
        color: #4e73df;
    }
</style>
{% endblock %}

{% block main %}
<div class="container mt-4">
    <div class="d-flex align-items-center mb-4">
        <i class="fas fa-credit-card fa-2x text-primary me-3"></i>
        <h1 class="h3 mb-0">Registrar Pago</h1>
    </div>

    <form method="post" id="pago-form">
        {% csrf_token %}

        <!-- ==================== CARD PAGADOR ==================== -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-user-circle me-2"></i> Información del Pagador
            </div>
            <div class="card-body">
                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input" id="es-alumno" name="es_alumno" checked>
                    <label class="form-check-label" for="es-alumno">
                        <i class="fas fa-graduation-cap me-1"></i>   El pago corresponde a un alumno registrado
                    </label>
                </div>

                <!-- Sección Alumno (visible por defecto) -->
                <div id="seccion-alumno">
                    <div class="form-group mb-3">
                        <label class="form-label"><i class="fas fa-search"></i> Alumno *</label>
                        <select id="alumno-select" name="alumno_id" class="form-control" style="width:100%"></select>
                    </div>
                </div>

                <!-- Sección Tercero (oculta inicialmente) -->
                <div id="seccion-tercero" style="display: none;">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label"><i class="fas fa-user"></i> Nombre *</label>
                            <input type="text" name="tercero_nombre" class="form-control">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label"><i class="fas fa-user"></i> Apellido *</label>
                            <input type="text" name="tercero_apellido" class="form-control">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label"><i class="fas fa-id-card"></i> DNI *</label>
                            <input type="text" name="tercero_dni" class="form-control">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label"><i class="fas fa-id-card"></i> CUIL</label>
                            <input type="text" name="tercero_cuil" class="form-control">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label"><i class="fas fa-home"></i> Domicilio</label>
                            <input type="text" name="tercero_domicilio" class="form-control">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== CARD CONCEPTOS ==================== -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-receipt me-2"></i> Conceptos
            </div>
            <div class="card-body">
                <div id="conceptos-container"></div>
                <button type="button" class="btn btn-outline-primary btn-sm mt-2" id="agregar-concepto">
                    <i class="fas fa-plus"></i> Agregar concepto
                </button>
            </div>
        </div>

        <!-- ==================== CARD DETALLES DEL PAGO ==================== -->
        <div class="card">
            <div class="card-header">
                <i class="fas fa-coins me-2"></i> Detalles del Pago
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <!-- Total con estilo destacado -->
                        <div class="total-card mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <span><i class="fas fa-dollar-sign"></i> Total a pagar</span>
                                <span id="total" class="h4 mb-0">$0.00</span>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label"><i class="fas fa-calendar-alt"></i> Fecha de pago</label>
                            <input type="date" name="fecha_pago" class="form-control" value="{{ hoy|date:'Y-m-d' }}" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label class="form-label"><i class="fas fa-credit-card"></i> Método de pago</label>
                            <select name="metodo_pago" class="form-select">
                                <option value="EFECTIVO">Efectivo</option>
                                <option value="TRANSFERENCIA">Transferencia</option>
                                <option value="TARJETA_CREDITO">Tarjeta Crédito</option>
                                <option value="TARJETA_DEBITO">Tarjeta Débito</option>
                                <option value="MERCADO_PAGO">Mercado Pago</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label"><i class="fas fa-hashtag"></i> Referencia</label>
                            <input type="text" name="referencia" class="form-control" placeholder="N° de comprobante / transacción">
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-12 mb-3">
                        <label class="form-label"><i class="fas fa-comment-dots"></i> Observaciones</label>
                        <textarea name="observaciones" class="form-control" rows="3" placeholder="Notas adicionales (pago parcial, talles de remeras, etc.)"></textarea>
                    </div>
                </div>
                <div class="form-check">
                    <input type="checkbox" name="confirmado" class="form-check-input" id="confirmado">
                    <label class="form-check-label" for="confirmado">
                        <i class="fas fa-check-circle"></i> Confirmar pago (marcar cuotas como pagadas)
                    </label>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary">
                <i class="fas fa-save me-1"></i> Guardar Pago
            </button>
            <a href="{% url 'facturacion:listar_pagos' %}" class="btn btn-secondary">
                <i class="fas fa-times me-1"></i> Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
<script>
$(document).ready(function() {
    
    // ---------- Select2 para alumnos ----------
    $('#alumno-select').select2({
        ajax: {
            url: '{% url "facturacion:api_buscar_alumnos" %}',
            dataType: 'json',
            delay: 250,
            data: function(params) {
                return { term: params.term };
            },
            processResults: function(data) {
                return { results: data.results };
            },
        },
        placeholder: 'Buscar alumno por nombre, apellido o DNI',
        minimumInputLength: 2,
    });

    // Almacén de cuotas por alumno
    let cuotasCache = {};

    // Función para cargar cuotas de un alumno (usa caché si está disponible)
    function cargarCuotas(alumnoId, callback) {
        if (cuotasCache[alumnoId]) {
            callback(cuotasCache[alumnoId]);
        } else {
            $.getJSON('{% url "facturacion:obtener_cuotas_alumno" 0 %}'.replace('0', alumnoId), function(response) {
                if (response.success) {
                    // Filtramos solo las cuotas NO pagadas
                    let cuotasPendientes = response.data.cuotas.filter(c => !c.pagada);
                    cuotasCache[alumnoId] = cuotasPendientes;
                    callback(cuotasPendientes);
                } else {
                    callback([]);
                }
            }).fail(function() {
                callback([]);
            });
        }
    }

    // Evento al cambiar alumno: actualizar todas las filas de tipo CUOTA
    $('#alumno-select').on('change', function() {
        let alumnoId = $(this).val();
        if (alumnoId) {
            cargarCuotas(alumnoId, function(cuotas) {
                // Actualizar cada fila que sea de tipo CUOTA
                $('.concepto-row').each(function() {
                    let row = $(this);
                    if (row.find('.tipo-concepto').val() === 'CUOTA') {
                        actualizarSelectorCuota(row, cuotas);
                    }
                });
            });
        } else {
            // Si se deselecciona alumno, mostrar selects deshabilitados en filas CUOTA
            $('.concepto-row').each(function() {
                let row = $(this);
                if (row.find('.tipo-concepto').val() === 'CUOTA') {
                    mostrarSelectorCuotaDeshabilitado(row);
                }
            });
        }
    });

    $(document).on('change', '.tipo-concepto', function() {
        let row = $(this).closest('.concepto-row');
        let index = row.data('index');
        actualizarSelectores(index);
    });

    // ---------- Funciones para manejar filas de concepto ----------
    function calcularSubtotal(row) {
        let cantidad = parseFloat(row.find('.cantidad').val()) || 0;
        let precio = parseFloat(row.find('.precio').val()) || 0;
        let subtotal = cantidad * precio;
        row.find('.subtotal').val(subtotal.toFixed(2));
        calcularTotal();
    }

    function calcularTotal() {
        let total = 0;
        $('.subtotal').each(function() {
            total += parseFloat($(this).val()) || 0;
        });
        $('#total').text('$' + total.toFixed(2));
    }

    function mostrarSelectorCuotaDeshabilitado(row) {
        let selectorDiv = row.find('.concepto-selector');
        selectorDiv.html('<select class="form-control" disabled><option>Primero seleccione un alumno</option></select>');
        // Limpiar campos relacionados
        row.find('.precio, .mes, .anio, .cuota-id').val('');
    }

    function actualizarSelectorCuota(row, cuotas) {
        let selectorDiv = row.find('.concepto-selector');
        if (!cuotas || cuotas.length === 0) {
            selectorDiv.html('<select class="form-control" disabled><option>No hay cuotas pendientes</option></select>');
            return;
        }

        let select = $('<select class="form-control concepto-select" style="width:100%"></select>');
        selectorDiv.html(select);

        let options = cuotas.map(c => ({
            id: c.id,
            text: `Cuota ${c.mes}/${c.año} - $${c.monto}`,
            precio: c.monto,
            mes: c.mes,
            año: c.año   // ← AGREGADO: año
        }));

        select.select2({
            data: options,
            placeholder: 'Seleccionar cuota',
            minimumResultsForSearch: 5
        });
    }

    function actualizarSelectores(index) {
        let row = $(`.concepto-row[data-index="${index}"]`);
        let tipo = row.find('.tipo-concepto').val();
        let selectorDiv = row.find('.concepto-selector');
        selectorDiv.empty();

        // Limpiar campos ocultos y visibles
        row.find('.cuota-id, .curso-id, .producto-id').val('');
        row.find('.precio').val('').prop('readonly', false);
        row.find('.descripcion').val('');
        row.find('.mes, .anio').val('');

        if (tipo === 'OTRO') {
            selectorDiv.html(`<input type="text" class="form-control descripcion-otro" placeholder="Descripción">`);
            return;
        }

        if (tipo === 'CUOTA') {
            let alumnoId = $('#alumno-select').val();
            if (!alumnoId) {
                mostrarSelectorCuotaDeshabilitado(row);
                return;
            }
            // Cargar cuotas (puede ser desde caché o llamada AJAX)
            cargarCuotas(alumnoId, function(cuotas) {
                actualizarSelectorCuota(row, cuotas);
            });
            return;
        }

        // Para CURSO y PRODUCTO
        let select = $(`<select class="form-control concepto-select" style="width:100%"></select>`);
        selectorDiv.html(select);

        let url = tipo === 'CURSO' ? '{% url "facturacion:api_buscar_curso" %}' : '{% url "facturacion:api_buscar_producto" %}';
        let placeholder = tipo === 'CURSO' ? 'Buscar curso' : 'Buscar producto';

        select.select2({
            ajax: {
                url: url,
                dataType: 'json',
                delay: 250,
                data: function(params) {
                    return { term: params.term };
                },
                processResults: function(data) {
                    return { results: data.results };
                }
            },
            placeholder: placeholder,
            minimumInputLength: 2
        });
    }

    // Evento cuando se selecciona algo en los selects dinámicos
    $(document).on('select2:select', '.concepto-select', function(e) {
        let row = $(this).closest('.concepto-row');
        let tipo = row.find('.tipo-concepto').val();
        let data = e.params.data;

        row.find('.precio').val(data.precio);
        row.find('.descripcion').val(data.text.split(' - ')[0] || data.text);
        
        if (tipo === 'CUOTA') {
            row.find('.mes').val(parseInt(data.mes, 10) || '');
            row.find('.anio').val(data.año || '');   // ← AGREGADO: asignar año
            row.find('.cuota-id').val(data.id);
        } else if (tipo === 'CURSO') {
            row.find('.curso-id').val(data.id);
        } else if (tipo === 'PRODUCTO') {
            row.find('.producto-id').val(data.id);
        }
        calcularSubtotal(row);
    });

    // Actualizar subtotal al cambiar cantidad o precio (manual)
    $(document).on('input', '.cantidad, .precio', function() {
        let row = $(this).closest('.concepto-row');
        calcularSubtotal(row);
    });

    // Eliminar fila
    $(document).on('click', '.remove-row', function() {
        $(this).closest('.concepto-row').remove();
        calcularTotal();
    });

    // Función para agregar nueva fila de concepto (CON CAMPO AÑO)
    function agregarConcepto() {
        let index = $('#conceptos-container .concepto-row').length;
        let html = `
            <div class="concepto-row" data-index="${index}">
                <div class="row g-3">
                    <div class="col-md-2">
                        <select class="form-select tipo-concepto">
                            <option value="CUOTA">Cuota</option>
                            <option value="CURSO">Curso</option>
                            <option value="PRODUCTO">Producto</option>
                            <option value="OTRO">Otro</option>
                        </select>
                    </div>
                    <div class="col-md-3 concepto-selector"></div>
                    <div class="col-md-1">
                        <input type="number" class="form-control cantidad" name="cantidad_${index}" value="1" min="0.01" step="0.01" placeholder="Cant.">
                    </div>
                    <div class="col-md-2">
                        <input type="number" class="form-control precio" name="precio_${index}" step="0.01" placeholder="Precio">
                    </div>
                    <div class="col-md-1">
                        <input type="text" class="form-control subtotal" name="subtotal_${index}" readonly placeholder="Subtotal">
                    </div>
                    <div class="col-md-1">
                        <input type="text" class="form-control mes" name="mes_${index}" placeholder="Mes">
                    </div>
                    <div class="col-md-1">
                        <input type="text" class="form-control anio" name="anio_${index}" placeholder="Año">   <!-- NUEVO campo año -->
                    </div>
                    <div class="col-md-1 text-center">
                        <span class="remove-row"><i class="fas fa-trash-alt"></i></span>
                    </div>
                </div>
                <input type="hidden" class="cuota-id" name="cuota_id_${index}">
                <input type="hidden" class="curso-id" name="curso_id_${index}">
                <input type="hidden" class="producto-id" name="producto_id_${index}">
                <input type="hidden" class="descripcion" name="descripcion_${index}">
            </div>
        `;
        $('#conceptos-container').append(html);
        
        // Aplicar el estado actual del checkbox a la nueva fila
        if (!$('#es-alumno').prop('checked')) {
            let nuevaFila = $('#conceptos-container .concepto-row').last();
            nuevaFila.find('.tipo-concepto option[value="CUOTA"]').prop('disabled', true);
        }
        
        actualizarSelectores(index);
    }

    // Vincular el botón "Agregar concepto"
    $('#agregar-concepto').on('click', agregarConcepto);

    // Inicializar primera fila
    agregarConcepto();

    // Manejar cambio del checkbox
    $('#es-alumno').on('change', function() {
        let esAlumno = $(this).prop('checked');
        if (esAlumno) {
            $('#seccion-alumno').show();
            $('#seccion-tercero').hide();
            // Habilitar opción CUOTA en todas las filas
            $('.tipo-concepto option[value="CUOTA"]').prop('disabled', false);
        } else {
            $('#seccion-alumno').hide();
            $('#seccion-tercero').show();
            // Deshabilitar opción CUOTA en todas las filas
            $('.tipo-concepto option[value="CUOTA"]').prop('disabled', true);
            // Si alguna fila ya tiene seleccionado CUOTA, cambiarlo a OTRO
            $('.tipo-concepto').each(function() {
                if ($(this).val() === 'CUOTA') {
                    $(this).val('OTRO');
                    $(this).trigger('change');
                }
            });
        }
    });

    // ---------- Envío del formulario (captura mes y año) ----------
    $('#pago-form').on('submit', function(e) {
        // Validación de alumno si corresponde
        let esAlumno = $('#es-alumno').prop('checked');
        if (esAlumno) {
            let alumnoId = $('#alumno-select').val();
            if (!alumnoId) {
                alert('Debe seleccionar un alumno.');
                e.preventDefault();
                return;
            }
        }
        let detalles = [];
        $('.concepto-row').each(function() {
            let row = $(this);
            let tipo = row.find('.tipo-concepto').val();
            let cantidad = row.find('.cantidad').val();
            let precio = row.find('.precio').val();
            let mesVal = row.find('.mes').val();
            let anioVal = row.find('.anio').val();   // ← CAPTURAR AÑO
            let descripcion = '';
            console.log('Mes encontrado:', row.find('.mes').val(), 'Año:', row.find('.anio').val());
            // Convertir a número si no está vacío
            let mesNum = (mesVal && mesVal.trim() !== '') ? parseInt(mesVal) : null;
            let anioNum = (anioVal && anioVal.trim() !== '') ? parseInt(anioVal) : null;
            console.log('Mes encontrado:', row.find('.mes').val(), 'Año:', row.find('.anio').val());
            if (tipo === 'CUOTA') {
                descripcion = row.find('.descripcion').val();
                if (!descripcion || !row.find('.cuota-id').val()) return;
                detalles.push({
                    tipo: tipo,
                    descripcion: descripcion,
                    cantidad: cantidad,
                    precio_unitario: precio,
                    mes: mesNum,
                    'año': anioNum,   
                    cuota_id: row.find('.cuota-id').val()
                });
            } else if (tipo === 'CURSO') {
                descripcion = row.find('.descripcion').val();
                if (!descripcion || !row.find('.curso-id').val()) return;
                detalles.push({
                    tipo: tipo,
                    descripcion: descripcion,
                    cantidad: cantidad,
                    precio_unitario: precio,
                    mes: mesNum,
                    'año': anioNum,             
                    curso_id: row.find('.curso-id').val()
                });
            } else if (tipo === 'PRODUCTO') {
                descripcion = row.find('.descripcion').val();
                if (!descripcion || !row.find('.producto-id').val()) return;
                detalles.push({
                    tipo: tipo,
                    descripcion: descripcion,
                    cantidad: cantidad,
                    precio_unitario: precio,
                    mes: mesNum,
                    'año': anioNum,                
                    producto_id: row.find('.producto-id').val()
                });
            } else { // OTRO
                descripcion = row.find('.descripcion-otro').val();
                if (!descripcion) return;
                detalles.push({
                    tipo: tipo,
                    descripcion: descripcion,
                    cantidad: cantidad,
                    precio_unitario: precio,
                    mes: mesNum,
                    'año': anioNum                
                });
            }
        });

        if (detalles.length === 0) {
            alert('Debe agregar al menos un concepto válido.');
            e.preventDefault();
            return;
        }

        // Agregar campo oculto con los detalles
        $('<input>').attr({
            type: 'hidden',
            name: 'detalles',
            value: JSON.stringify(detalles)
        }).appendTo('#pago-form');
    });
});
</script>
{% endblock %}
