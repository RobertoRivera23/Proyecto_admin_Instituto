{% extends 'permisos/base_permisos.html' %}

{% block title %}Crear Nuevo Permiso{% endblock %}
{% block page_title %}Crear Nuevo Permiso Personalizado{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">Nuevo Permiso</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Nombre del Permiso</label>
                        <input type="text" class="form-control" name="nombre_permiso" 
                               placeholder="Ej: can_manage_finances" required>
                        <small class="text-muted">Debe comenzar con 'can_'</small>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea class="form-control" name="descripcion" rows="3" 
                                  placeholder="Descripción del permiso"></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Tipo de Permiso</label>
                        <select class="form-select" name="tipo_permiso">
                            <option value="web">Web (Gestión de personal)</option>
                            <option value="auth">Auth (Gestión de usuarios)</option>
                        </select>
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'listar_grupos_permisos' %}" class="btn btn-outline-secondary">
                            Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-plus-circle"></i> Crear Permiso
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
